server:
  port: 8080
  servlet:
    session:
      cookie:
        name: CLIENT_JSESSIONID # 🛠️ Unique cookie for port 8080

spring:
  security:
    oauth2:
      client:
        registration:
          web-portal-client:
            client-id: web-portal-client
            client-secret: secret-key-123
            authorization-grant-type: authorization_code
            scope: openid, profile, read
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          web-portal-client:
            issuer-uri: http://127.0.0.1:9000

logging:
  level:
    org.springframework.security: TRACE